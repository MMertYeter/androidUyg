name: Build Android APK (Auto-Detect)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Auto-Detect Project and Build
        run: |
          # Android projesinin kök dizinini (settings.gradle dosyasının olduğu yeri) otomatik bul
          ANDROID_DIR=$(dirname $(find . -name "settings.gradle*" -print -quit))
          echo "Android projesi bulundu: $ANDROID_DIR"
          
          # Bulunan dizine geçiş yap
          cd "$ANDROID_DIR"

          # gradlew betiği eksikse sistem Gradle'ı ile otomatik oluştur
          if [ ! -f "gradlew" ]; then
            echo "gradlew bulunamadı, oluşturuluyor..."
            gradle wrapper
          fi

          # Çalıştırma izni ver ve derlemeyi başlat
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SyncListen-Debug-APK
          # APK depodaki hangi alt klasörde üretilirse üretilsin otomatik bulup yükler
          path: "**/build/outputs/apk/debug/*.apk"
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SyncListen-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
 
