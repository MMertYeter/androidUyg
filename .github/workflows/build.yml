name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle Wrapper and Grant Permissions
        run: |
          cd android
          # Eğer gradlew dosyası projede yoksa sistemdeki Gradle ile oluştur
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          # Çalıştırma iznini ver
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SyncListen-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
 
