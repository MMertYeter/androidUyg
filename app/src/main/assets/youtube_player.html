<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <style>
    html, body { margin:0; padding:0; background:#000; overflow:hidden; }
    #player { width:100%; height:100%; }
  </style>
</head>
<body>
  <div id="player"></div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    var player;
    var pendingVideoId = null;
    var pendingStartSeconds = 0;
    var timeUpdateHandle = null;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        playerVars: {
          'playsinline': 1,
          'controls': 1,
          'rel': 0,
          'modestbranding': 1
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange,
          'onError': onPlayerError
        }
      });
    }

    function onPlayerReady() {
      if (Android) Android.onReady();
      if (pendingVideoId) {
        player.loadVideoById({videoId: pendingVideoId, startSeconds: pendingStartSeconds});
        pendingVideoId = null;
      }
      startTimeUpdates();
    }

    function onPlayerStateChange(event) {
      if (Android) Android.onStateChange(event.data);
    }

    function onPlayerError(event) {
      if (Android) Android.onError(event.data);
    }

    function startTimeUpdates() {
      if (timeUpdateHandle) clearInterval(timeUpdateHandle);
      timeUpdateHandle = setInterval(function() {
        if (player && player.getCurrentTime) {
          try {
            var seconds = player.getCurrentTime();
            if (Android) Android.onTimeUpdate(seconds);
          } catch (e) {}
        }
      }, 500);
    }

    // ---- Functions called FROM Kotlin ----
    function loadVideo(videoId, startSeconds) {
      if (player && player.loadVideoById) {
        player.loadVideoById({videoId: videoId, startSeconds: startSeconds});
      } else {
        pendingVideoId = videoId;
        pendingStartSeconds = startSeconds;
      }
    }
    function playVideo() { if (player && player.playVideo) player.playVideo(); }
    function pauseVideo() { if (player && player.pauseVideo) player.pauseVideo(); }
    function seekTo(seconds) { if (player && player.seekTo) player.seekTo(seconds, true); }
  </script>
</body>
</html>
